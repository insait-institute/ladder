autoclass: ladder.components.inference.api.client.hlc.controller.SubtaskController
source:
  autoclass: ladder.components.inference.api.client.hlc.sources.decomposers.Decomposer
  cache_path: ""  # the benchmark points this at its tracked plans; unset = decompose at reset
  vlm:
    import: vlm.yaml
  max_tokens: 8192  # a reasoning model's hidden thinking tokens count against this
advancer:
  autoclass: ladder.components.inference.api.client.hlc.advancers.periodic.PeriodicAdvancer
  # Walk the plan on a clock with no feedback of any kind. This is the control for both feedback
  # systems: plan_gripper switches on an event the robot produces, plan_verifier on a judgement about
  # the scene, and this one on neither. The interval is the oracle's median time on a subtask (the
  # median, because the mean is skewed by a long tail), so only the lack of feedback distinguishes it.
  interval: 27
