autoclass: ladder.components.inference.api.client.hlc.controller.SubtaskController
source:
  autoclass: ladder.components.inference.api.client.hlc.sources.decomposers.Decomposer
  cache_path: ""  # the benchmark points this at its tracked plans; unset = decompose at reset
  vlm:
    import: vlm.yaml
  max_tokens: 8192  # a reasoning model's hidden thinking tokens count against this
advancer:
  autoclass: ladder.components.inference.api.client.hlc.advancers.periodic.PeriodicAdvancer
  # Walk the plan on a clock, with no feedback of any kind -- the control for both feedback systems:
  # plan_gripper switches on an event the robot produces, plan_verifier on a judgement about the
  # scene, and this one on neither. A gap to it is what makes either feedback signal worth its cost.
  # The interval is set to the oracle's median time on a subtask, so the clock is right on average and
  # only its lack of feedback distinguishes it (measured on SimplerEnv composition: median 27 steps,
  # mean 39 -- the mean is dragged by a long tail, so the median is the honest centre).
  interval: 27
