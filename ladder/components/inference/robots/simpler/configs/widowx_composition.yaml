autoclass: ladder.components.inference.robots.simpler.simpler_server.SimplerServer
# One server config for every composition task in composition/envs.py: a run picks the scene by
# overriding env_config.env_name and sweeps the registry (see vlam_simpler_bridge.sh).
env_config:
  # A real registry env so the config runs as-is; each run overrides it per task.
  env_name: all2_plate-v0
  robot_name: widowx
  scene_name: bridge_table_1_v1
  rgb_overlay_path: ladder/components/inference/robots/simpler/maniskill2/data/real_inpainting/bridge_real_eval_1.png
  raytracing: False

  max_episode_steps: 0  # 0 => use each task's registered budget (100 steps/goal, see composition_specs)
  sim_freq: 500
  control_freq: 5

  n_envs: 24  # parallel ManiSkill3 envs per scene = 24 episodes (standard SimplerEnv episode count)
  episode_layouts: 24  # object-position layouts generated per scene; object_episode_range indexes them

  # PD pose controller in base frame; PD gripper position controller
  control_mode: arm_pd_ee_target_base_pose_gripper_pd_joint_pos

init_range_config:
  robot_init_x_range: [0.147, 0.147, 1]  # [x_min, x_max, x_num]
  robot_init_y_range: [0.028, 0.028, 1]  # [y_min, y_max, y_num]
  robot_init_quat_center: [0, 0, 1, 0]  # [x, y, z, w]
  robot_init_roll_range: [0, 0, 1]  # [roll_min, roll_max, roll_num]
  robot_init_pitch_range: [0, 0, 1]  # [pitch_min, pitch_max, pitch_num]
  robot_init_yaw_range: [0, 0, 1]  # [yaw_min, yaw_max, yaw_num]
  object_variation_mode: episode
  object_episode_range: [0, 24]  # [start, end], 24 object-position layouts per scene

request_listener_config:
  req_rep_server_config:
    autoclass: ladder.components.inference.api.core.request_reply.ZmqRequestReplyServer
    port: 5556
