import: ../../../../vlams/configs/robot_arena/composition/vlam_robot_arena_composition.yaml

policy_config: !overwrite
  autoclass: ladder.components.inference.models.capx.policy.CapxPolicy
  vlm:
    import: ../../../../../api/client/hlc/configs/vlm.yaml
    rate_limit_attempts: 16
  robot: WidowX 250 robot arm
  scene: camera
  max_translation_per_step_m: 0.03
  move_steps: 25
  open_gripper_steps: 10
  close_gripper_steps: 18
  align_grasp_yaw: True
  arrive_tolerance_m: 0.008
  settle_tolerance_m: 0.04
  support_z_m: 0.0

runner_config:
  recorder_config:
    output_path: /home/$USER/experiments/vlams/control/$SESSION_NAME/robot_arena_composition_capx/$CKPT_NAME/$ENV_NAME
