import: ../vlam_simpler_remote.yaml

runner_config:
  recorder_config:
    output_path: /home/$USER/experiments/vlams/control/$SESSION_NAME/simpler_volo/$CKPT_NAME/$ENV_NAME
  hlc_config:
    import: ../../../../api/client/hlc/configs/volo.yaml
