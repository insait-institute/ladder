import: ../robot_arena/language/vlam_robot_arena_unified.yaml

runner_config:
  recorder_config:
    output_path: /home/$USER/experiments/vlams/control/$SESSION_NAME/robot_arena_volo/$CKPT_NAME/$ENV_NAME
  hlc_config:
    import: ../../../../api/client/hlc/configs/volo.yaml
    # RobotArena's `wrist` key is zeros, not a rendered view; episodes are 60 steps, so upstream's
    # 80 would never fire. This benchmark runs full episodes (terminate_on_success: False).
    extra_cameras: []
    check_interval: 15
    stop_on_success: false
