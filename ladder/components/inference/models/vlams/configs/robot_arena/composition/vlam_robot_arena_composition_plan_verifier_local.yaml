import: vlam_robot_arena_composition.yaml

# RobotArena composition -- _plan_verifier with every VLM role served in-process rather than by a
# remote API, so the arm runs with no credentials and no network.
runner_config:
  hlc_config:
    import: ../../../../../api/client/hlc/configs/plan_verifier_local.yaml
    source:
      cache_path: ladder/components/inference/robots/robot_arena/composition/decomp_cache.json
  recorder_config:
    output_path: /home/$USER/experiments/vlams/control/$SESSION_NAME/robot_arena_composition_plan_verifier_local/$CKPT_NAME/$ENV_NAME
