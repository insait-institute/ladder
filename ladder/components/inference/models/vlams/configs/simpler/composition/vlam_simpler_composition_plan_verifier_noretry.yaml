import: vlam_simpler_composition.yaml

# SimplerEnv composition -- a not-done verdict does not withhold advancement: the verifier still runs and every verdict
# is still logged, the controller just moves on. Paired with _plan_verifier this separates the value
# of TESTING completion from the value of REFUSING to advance.
runner_config:
  hlc_config:
    import: ../../../../../api/client/hlc/configs/plan_verifier_noretry.yaml
    source:
      cache_path: ladder/components/inference/robots/simpler/composition/decomp_cache.json
  recorder_config:
    output_path: /home/$USER/experiments/vlams/control/$SESSION_NAME/simpler_composition_plan_verifier_noretry/$CKPT_NAME/$ENV_NAME
