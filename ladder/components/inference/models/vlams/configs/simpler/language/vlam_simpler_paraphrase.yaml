import: ../../vlam_simpler.yaml
runner_config:
  recorder_config:
    output_path: /home/$USER/experiments/vlams/control/$SESSION_NAME/simpler_paraphrase/$CKPT_NAME/$ENV_NAME
    fps: 5
    rerun_enabled: False
  # paraphrase robustness test - multiple rephrasings of the correct instruction
  # cycles through them across episodes (episode_count % num_paraphrases)
  # a language-following model should be robust to paraphrases; a memorizing model will degrade
  instruction_override:
    PutCarrotOnPlateInScene-v0:
      - "put the carrot on the plate"
      - "place the carrot onto the plate"
      - "could you please move the carrot to the plate"
      - "just grab the carrot and drop it on the plate"
      - "please transfer the carrot to the plate"
      - "carrot onto plate"
      - "i need you to pick up the carrot and gently set it down on the plate"
      - "move the carrot over to the plate"
      - "take the carrot and lay it on the plate"
      - "can you position the carrot on top of the plate"
      - "set the carrot on the plate"
      - "relocate the carrot to the plate"
      - "shift the carrot so that it rests on the plate"
      - "toss that carrot onto the plate"
      - "drop the carrot on the plate"
      - "would you mind placing the carrot on the plate for me"
      - "transport the carrot to the plate"
      - "pick up the carrot then place it directly on the plate"
      - "deposit the carrot onto the plate"
      - "carrot to plate"

    PutSpoonOnTableClothInScene-v0:
      - "put the spoon on the towel"
      - "place the spoon onto the towel"
      - "could you please move the spoon to the towel"
      - "just grab the spoon and drop it on the towel"
      - "please transfer the spoon to the towel"
      - "spoon onto towel"
      - "i need you to pick up the spoon and carefully set it down on the towel"
      - "move the spoon over to the towel"
      - "take the spoon and lay it on the towel"
      - "can you position the spoon on top of the towel"
      - "set the spoon on the towel"
      - "relocate the spoon to the towel"
      - "shift the spoon so that it rests on the towel"
      - "put that spoon down onto the towel"
      - "drop the spoon on the towel"
      - "would you mind placing the spoon on the towel for me"
      - "transport the spoon to the towel"
      - "pick up the spoon then place it directly on the towel"
      - "deposit the spoon onto the towel"
      - "spoon to towel"

    PutEggplantInBasketScene-v0:
      - "put the eggplant in the basket"
      - "place the eggplant into the basket"
      - "could you please move the eggplant to the basket"
      - "just grab the eggplant and drop it in the basket"
      - "please transfer the eggplant into the basket"
      - "eggplant into basket"
      - "i need you to pick up the eggplant and carefully place it inside the basket"
      - "move the eggplant over to the basket"
      - "take the eggplant and put it inside the basket"
      - "can you position the eggplant within the basket"
      - "set the eggplant in the basket"
      - "relocate the eggplant to the inside of the basket"
      - "shift the eggplant so that it rests inside the basket"
      - "pop that eggplant right into the basket"
      - "drop the eggplant in the basket"
      - "would you mind placing the eggplant in the basket for me"
      - "transport the eggplant into the basket"
      - "pick up the eggplant then place it directly inside the basket"
      - "deposit the eggplant into the basket"
      - "eggplant to basket"

    StackGreenCubeOnYellowCubeInScene-v0:
      - "stack the green block on the yellow block"
      - "place the green block onto the yellow block"
      - "could you please move the green block on top of the yellow block"
      - "just grab the green block and drop it on the yellow block"
      - "please transfer the green block to the top of the yellow block"
      - "green block onto yellow block"
      - "i need you to pick up the green block and carefully stack it right on top of the yellow block"
      - "move the green block over to the yellow block"
      - "take the green block and lay it on the yellow block"
      - "can you position the green block on top of the yellow block"
      - "set the green block on the yellow block"
      - "relocate the green block onto the yellow block"
