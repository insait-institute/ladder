description: A proprietary robotic system uses Qwen3.8-Max to autonomously select
  appropriate skills from a fixed skill library based on public instructions and
  robot embodiment, without per-task tuning. The system was adapted to LADDER during
  development. Each episode starts with fresh memory. No hidden simulator object
  poses, evaluator labels or scores enter the policy. This is a closed-source, results-only
  LADDER-Lite submission.
