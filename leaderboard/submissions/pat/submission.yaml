description: >-
  PAT: A Local Physical Agent That Teaches Its Own VLA. A local Qwen3.8-27B orchestrator, distilled from GPT-5.5
  trajectories on 33 RoboLab-120 tasks, splits the instruction into subgoals, monitors execution from the camera
  images and replans on failure. On RoboLab-Long it runs through the agent interface: for each subgoal it either
  issues a language command to pi0.5 DROID (joint position) or calls a grasp or place primitive (SAM3 and Molmo2 for
  perception, GraspGen and cuRobo for planning on the external camera's depth); joint chunks are executed the way
  LADDER executes pi0.5. That pi0.5 is fine-tuned once on its own successful episodes, collected by the same
  orchestrator on RoboLab tasks from a task generator, mixed with DROID. On the two WidowX suites only the
  orchestrator runs, issuing language subgoals to the suite's Bridge policy, with no primitives and no fine-tuning.
  Every model runs locally; no part was trained or tuned on LADDER's tasks or scenes, and the planning prompt is the
  one used on RoboLab. A task whose run stopped before writing any result (GPU out of memory, or its shard stopped to
  move to another card) was re-run whole; no written episode was re-run.
