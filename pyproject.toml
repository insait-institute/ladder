[project]
name = "ladder"
version = "0.0.0"

[tool.black]
line-length = 110
target-version = ['py310']
skip-string-normalization = true
force-exclude = ''

[tool.coverage.run]
omit = ["*/test/test_*.py", "*/test/*/test_*.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "@(abc\\.)?abstractmethod"]
skip_empty = true

[tool.isort]
combine_as_imports = true
known_first_party = ["ladder"]
profile = 'black'
line_length = 110
